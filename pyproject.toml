[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "moldloft"
dynamic = ["version"]
description = "Local execution dependency graph, exploration notebook, and Git ground-truth workbench"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn>=0.34,<1",
    "mcp>=1.30,<2",
    "pyyaml>=6.0,<7",
]

[project.optional-dependencies]
dev = ["httpx>=0.28,<1", "build>=1.2,<2"]

[project.scripts]
moldloft = "moldloft.__main__:main"

[tool.setuptools]
include-package-data = false

[tool.setuptools.dynamic]
version = {attr = "moldloft.__version__"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["moldloft"]

[tool.setuptools.package-data]
moldloft = ["static/*.html", "static/*.js", "static/*.css", "static/vendor/elk/*"]
